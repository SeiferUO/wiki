site_name: Unchained Wiki
site_description: The player's guide to the Unchained Ultima Online shard
site_url: https://wiki.play-uo.com/
theme:
  name: material
  logo: assets/shield.svg
  favicon: assets/shield.svg
  font:
    text: EB Garamond
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to parchment }
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/white-balance-sunny, name: Switch to dungeon }
extra_css:
  - stylesheets/unchained.css
markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - toc: { permalink: true }
plugins:
  - search
nav:
